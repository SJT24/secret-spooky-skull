<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>善鸡通 · 管理中心</title><link rel="icon" type="image/svg+xml" href="assets/favicon.svg"><meta name="theme-color" content="#16834A">
<style>body{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;max-width:820px;margin:0 auto;padding:clamp(16px,4vw,28px);color:#17251d}h1{font-size:24px;border-left:5px solid #16834a;padding-left:12px}h2{margin-top:24px;font-size:18px}input,textarea{box-sizing:border-box;width:100%;padding:11px;border:1px solid #dfe1e5;border-radius:9px;margin:5px 0;font:inherit}button{border:0;border-radius:8px;background:#16834a;color:white;padding:10px 14px;margin:4px 4px 4px 0;font:inherit}.muted{color:#70757a;font-size:13px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{background:#f2f6f2;padding:12px;border-radius:10px}.card b{display:block;font-size:22px}.status{white-space:pre-wrap;margin:10px 0}.warn{color:#a15c00}</style></head><body>
<h1>善鸡通 · 管理中心</h1><p class="muted">此页面使用搜索管线的管理 API。请仅在 HTTPS 服务地址下输入管理令牌。</p>
<label>管理令牌（ADMIN_TOKEN）</label><input id="token" type="password" autocomplete="current-password" placeholder="粘贴服务器 ADMIN_TOKEN">
<div><button id="save">保存令牌并连接</button><button id="refresh">刷新概况</button></div><div id="status" class="status"></div>
<h2>索引概况</h2><div id="cards" class="cards"></div><div id="recent" class="muted"></div>
<h2>添加抓取种子网址</h2><p class="muted">每行一个 HTTPS/HTTP 网址。此操作只加入后端种子/抓取队列；后台 worker 必须在服务器端运行。</p><textarea id="urls" rows="5" placeholder="https://example.com/
https://example.org/"></textarea><button id="add">添加种子</button><pre id="addResult" class="status"></pre>
<script>
const $=id=>document.getElementById(id);const API_BASE=(new URLSearchParams(location.search).get('apiBase')||'').replace(/\/$/,'');const apiUrl=p=>API_BASE+p;
const tokenKey='sjt-admin-token';$('token').value=sessionStorage.getItem(tokenKey)||'';
async function api(path,options={}){if(!API_BASE)throw new Error('未设置搜索服务地址：请回浏览器点击“服务设置”。');const headers={'Accept':'application/json',...(options.headers||{}),'Authorization':'Bearer '+$('token').value};if(options.body)headers['Content-Type']='application/json';const r=await fetch(apiUrl(path),{...options,headers});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(r.status===401?'管理令牌不正确或服务端 ADMIN_TOKEN 未配置':(data.error||'请求失败 HTTP '+r.status));return data}
async function refresh(){try{$('status').textContent='正在连接…';const s=await api('/api/admin/stats');const c=s.counts||{};$('cards').innerHTML='';[['发现网址',c.discovered],['已收录文档',c.documents],['排队中',c.queued],['已索引',c.indexed],['被拦截',c.blocked],['失败',c.errors],['向量文档',c.embedded]].forEach(([k,v])=>{const d=document.createElement('div');d.className='card';const b=document.createElement('b');b.textContent=(v??'—');d.append(b,document.createTextNode(k));$('cards').append(d)});$('recent').textContent='近 24 小时事件：'+JSON.stringify(s.last24Hours||[]);$('status').textContent='连接成功：'+API_BASE}catch(e){$('status').textContent=e.message;$('cards').innerHTML='';}}
$('save').onclick=()=>{sessionStorage.setItem(tokenKey,$('token').value);refresh()};$('refresh').onclick=refresh;
$('add').onclick=async()=>{const urls=$('urls').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!urls.length)return;try{const r=await api('/api/admin/seeds',{method:'POST',body:JSON.stringify({urls})});$('addResult').textContent=JSON.stringify(r,null,2);refresh()}catch(e){$('addResult').textContent=e.message}};
refresh();
</script></body></html>
